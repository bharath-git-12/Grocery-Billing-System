
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Notification - Grocery Billing System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Grocery Billing System</h1>
    </header>

    <main class="cart-page">

        <div class="bill-summary">

            <h2>✅ Order Placed Successfully!</h2>

            <p>Your order has been saved successfully.</p>

            <p id="orderDetails"></p>

            <h3>📲 WhatsApp Notifications</h3>

            <button id="adminButton" class="order-button">
                Send Order to Admin WhatsApp
            </button>

            <br><br>

            <button id="customerButton" class="order-button">
                Send Confirmation to Customer WhatsApp
            </button>

            <br><br>

            <a href="products.html">
                🛒 Continue Shopping
            </a>

        </div>

    </main>

    <script src="js/whatsapp.js"></script>

    <script>

        const adminMessage =
            sessionStorage.getItem("adminMessage");

        const customerMessage =
            sessionStorage.getItem("customerMessage");

        const customerMobile =
            sessionStorage.getItem("customerMobile");

        const orderId =
            sessionStorage.getItem("orderId");

        document.getElementById("orderDetails").textContent =
            "Order ID: " + (orderId || "Unavailable");

        document.getElementById("adminButton").onclick = function () {

            if (!adminMessage || ADMIN_WHATSAPP.includes("X")) {
                alert("Please configure Admin WhatsApp number in whatsapp.js");
                return;
            }

            window.open(
                getWhatsAppLink(ADMIN_WHATSAPP, adminMessage),
                "_blank"
            );

        };

        document.getElementById("customerButton").onclick = function () {

            if (!customerMessage || !customerMobile) {
                alert("Customer notification details unavailable.");
                return;
            }

            window.open(
                getWhatsAppLink(customerMobile, customerMessage),
                "_blank"
            );

        };

    </script>

</body>
</html>
