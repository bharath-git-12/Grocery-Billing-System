<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Grocery Billing System</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <h1>Grocery Billing System</h1>

        <div class="nav">

            <a href="products.html">
                ← Continue Shopping
            </a>

            <a href="index.html">
                Logout
            </a>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="cart-page">


        <h2>🛒 Your Shopping Cart</h2>

        <p>
            Review your selected products before placing the order.
        </p>


        <!-- ================= CART PRODUCTS ================= -->

        <div id="cartContainer">
        </div>


        <!-- ================= BILL SUMMARY ================= -->

        <div class="bill-summary">

            <h3>Bill Summary</h3>


            <p>
                Subtotal:
                ₹<span id="subtotal">0.00</span>
            </p>


            <p>
                GST (5%):
                ₹<span id="gst">0.00</span>
            </p>


            <hr>


            <h2>
                Grand Total:
                ₹<span id="grandTotal">0.00</span>
            </h2>


            <!-- PLACE ORDER -->

            <button
                class="order-button"
                onclick="placeOrder()">

                🛍️ Place Order

            </button>

        </div>


        <!-- ================= ORDER SUCCESS ================= -->

        <div id="orderSuccess"
             class="order-success"
             style="display:none;">


            <h2>
                🎉 Your Order Placed Successfully!
            </h2>


            <p>
                Scan the QR Code to view your order details
            </p>


            <!-- QR CODE -->

            <div id="qrcode"></div>


            <!-- ORDER ID -->

            <p id="orderId"></p>


            <!-- CONTINUE SHOPPING -->

            <button
                onclick="continueShopping()"
                class="continue-btn">

                🛒 Continue to Shopping

            </button>


        </div>


    </main>


    <!-- ================= QR CODE LIBRARY ================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <!-- ================= CART JAVASCRIPT ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/cart.js"></script>


</body>

</html>
